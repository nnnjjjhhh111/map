<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的旅行地图 - njh ❤️ zcj</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pink: #ff6b9d;
            --pink-light: #ffc2d1;
            --pink-dark: #c9184a;
            --purple: #a855f7;
            --gold: #fbbf24;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 50%, #fce4ec 100%);
            min-height: 100vh;
        }

        /* 飘落花瓣动画 */
        .floating-petals {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .petal {
            position: absolute; animation: fall linear infinite; opacity: 0.6; font-size: 18px;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(100vh) rotate(360deg) translateX(20px); opacity: 0; }
        }

        /* 头部 */
        header {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white; padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(255, 107, 157, 0.3);
            position: relative; z-index: 100;
        }
        .header-content {
            max-width: 1400px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.8rem; font-weight: bold; }
        .logo span { color: var(--gold); }
        nav ul { display: flex; gap: 2rem; list-style: none; }
        nav a {
            color: white; text-decoration: none; font-size: 1rem;
            padding: 0.5rem 1rem; border-radius: 20px; transition: all 0.3s;
        }
        nav a:hover { background: rgba(255,255,255,0.2); }

        /* 主容器 */
        .main-container {
            max-width: 1400px; margin: 0 auto; padding: 2rem;
            position: relative; z-index: 1;
        }

        /* 统计卡片 */
        .stats-bar {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem; margin-bottom: 2rem;
        }
        .stat-card {
            background: white; padding: 1.5rem; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.2); transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card .icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .stat-card .number { font-size: 2rem; color: var(--pink-dark); font-weight: bold; }
        .stat-card .label { color: #888; font-size: 0.9rem; }

        /* 内容区域 */
        .content-area {
            display: grid; grid-template-columns: 1fr 350px;
            gap: 2rem; margin-bottom: 2rem;
        }

        /* 地图容器 */
        .map-section {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        #map { height: 550px; width: 100%; }
        .map-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        .map-header h2 { color: var(--pink-dark); font-size: 1.3rem; }
        .map-hint {
            color: #888; font-size: 0.85rem;
            background: #fce4ec; padding: 0.4rem 0.8rem; border-radius: 20px;
        }

        /* 侧边栏 */
        .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }

        .add-city-card {
            background: white; padding: 1.5rem; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.2);
        }
        .add-city-card h3 { color: var(--pink-dark); margin-bottom: 1rem; font-size: 1.1rem; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; color: #666; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.8rem 1rem; border: 2px solid #fce4ec;
            border-radius: 12px; font-size: 0.95rem; font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: var(--pink);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }

        .btn {
            width: 100%; padding: 1rem;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white; border: none; border-radius: 12px;
            font-size: 1rem; cursor: pointer; transition: all 0.3s;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
        }

        /* 最近去过的地方 */
        .recent-cities-card {
            background: white; padding: 1.5rem; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.2); flex: 1;
        }
        .recent-cities-card h3 { color: var(--pink-dark); margin-bottom: 1rem; font-size: 1.1rem; }
        .city-list { list-style: none; max-height: 300px; overflow-y: auto; }
        .city-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem; border-radius: 10px; margin-bottom: 0.5rem;
            background: #fce4ec; cursor: pointer; transition: all 0.3s;
        }
        .city-item:hover { background: var(--pink-light); transform: translateX(5px); }
        .city-item .city-name { font-weight: 500; color: var(--pink-dark); }
        .city-item .city-date { font-size: 0.8rem; color: #888; }

        /* 时间线 */
        .timeline-section {
            background: white; border-radius: 20px; padding: 2rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        .timeline-section h2 { color: var(--pink-dark); margin-bottom: 1.5rem; }
        .timeline { position: relative; padding-left: 2rem; }
        .timeline::before {
            content: ''; position: absolute; left: 8px; top: 0; bottom: 0;
            width: 3px; background: linear-gradient(to bottom, var(--pink), var(--purple));
            border-radius: 3px;
        }
        .timeline-item { position: relative; padding-bottom: 2rem; }
        .timeline-item::before {
            content: '❤️'; position: absolute; left: -2.2rem; top: 0; font-size: 1rem;
        }
        .timeline-item .date { color: var(--pink); font-weight: 500; margin-bottom: 0.5rem; }
        .timeline-item .city-name {
            font-size: 1.2rem; color: var(--pink-dark); margin-bottom: 0.5rem;
        }
        .timeline-item .description { color: #666; line-height: 1.8; }

        /* 模态框 */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            justify-content: center; align-items: center;
            z-index: 2000; padding: 2rem;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; border-radius: 30px; max-width: 700px; width: 100%;
            max-height: 90vh; overflow-y: auto; position: relative;
            animation: modalSlide 0.3s ease-out;
        }
        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            padding: 2rem; border-radius: 30px 30px 0 0; color: white; position: relative;
        }
        .modal-close {
            position: absolute; top: 1rem; right: 1rem; font-size: 1.5rem;
            color: white; cursor: pointer; width: 40px; height: 40px;
            border-radius: 50%; background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }
        .modal-body { padding: 2rem; }
        .city-detail-date { color: #888; margin-bottom: 1rem; }
        .city-detail-weather {
            display: inline-block; background: #fce4ec; padding: 0.5rem 1rem;
            border-radius: 20px; color: var(--pink-dark); margin-bottom: 1rem;
        }
        .city-detail-description {
            color: #666; line-height: 2; margin-bottom: 2rem; white-space: pre-wrap;
        }
        .photo-gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem; margin-top: 1rem;
        }
        .photo-item {
            aspect-ratio: 1; border-radius: 15px; overflow: hidden; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: transform 0.3s;
        }
        .photo-item:hover { transform: scale(1.05); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .add-photo-btn {
            border: 2px dashed var(--pink); display: flex; align-items: center;
            justify-content: center; color: var(--pink); font-size: 2rem;
            transition: all 0.3s; cursor: pointer;
        }
        .add-photo-btn:hover { background: #fce4ec; }

        .btn-danger {
            background: #ff6b6b; color: white; border: none;
            padding: 0.8rem 1.5rem; border-radius: 10px; cursor: pointer;
            transition: all 0.3s;
        }
        .btn-danger:hover { background: #e05555; }

        /* 地图点击添加表单 */
        .map-add-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; border-radius: 25px; padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 1500;
            width: 420px; max-height: 90vh; overflow-y: auto; display: none;
            animation: modalSlide 0.3s ease-out;
        }
        .map-add-panel.active { display: block; }
        .map-add-panel h3 {
            color: var(--pink-dark); margin-bottom: 0.5rem; font-size: 1.3rem;
        }
        .map-add-panel .location-info {
            background: #fce4ec; padding: 0.8rem 1rem; border-radius: 12px;
            margin-bottom: 1rem; color: var(--pink-dark); font-size: 0.95rem;
        }
        .map-add-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1499; display: none;
        }
        .map-add-overlay.active { display: block; }

        /* 自定义百度地图标记样式 */
        .custom-marker {
            width: 36px; height: 36px; text-align: center;
            font-size: 22px; line-height: 36px;
            filter: drop-shadow(0 2px 4px rgba(255,107,157,0.5));
            cursor: pointer;
        }

        /* 百度地图信息窗口样式 */
        .info-window {
            padding: 8px; min-width: 180px;
        }
        .info-window h4 {
            color: #c9184a; margin: 0 0 6px; font-size: 15px;
        }
        .info-window p {
            color: #666; margin: 3px 0; font-size: 13px;
        }
        .info-window .info-btn {
            margin-top: 8px; padding: 6px 14px;
            background: linear-gradient(135deg, #ff6b9d, #a855f7);
            color: white; border: none; border-radius: 8px;
            cursor: pointer; font-size: 12px;
        }
        .info-window .info-btn:hover { opacity: 0.9; }

        /* 提示气泡 */
        .toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white; padding: 1rem 2rem; border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
            z-index: 3000; font-size: 1rem;
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2s forwards;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

        /* 响应式 */
        @media (max-width: 900px) {
            .content-area { grid-template-columns: 1fr; }
            .sidebar { flex-direction: column; }
            .map-add-panel { width: 90%; }
        }
        @media (max-width: 600px) {
            .header-content { flex-direction: column; gap: 1rem; }
            nav ul { gap: 1rem; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .stat-card .number { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="floating-petals" id="petals"></div>

    <header>
        <div class="header-content">
            <div class="logo">✈️ njh <span>❤️</span> zcj 的旅行地图</div>
            <nav>
                <ul>
                    <li><a href="#" onclick="showSection('map'); return false;">🗺️ 地图</a></li>
                    <li><a href="#" onclick="showSection('timeline'); return false;">📅 时间线</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-container">
        <div class="stats-bar">
            <div class="stat-card">
                <div class="icon">🏙️</div>
                <div class="number" id="city-count">0</div>
                <div class="label">去过的城市</div>
            </div>
            <div class="stat-card">
                <div class="icon">🗺️</div>
                <div class="number" id="province-count">0</div>
                <div class="label">去过的省份</div>
            </div>
            <div class="stat-card">
                <div class="icon">📸</div>
                <div class="number" id="photo-count">0</div>
                <div class="label">照片总数</div>
            </div>
            <div class="stat-card">
                <div class="icon">💕</div>
                <div class="number" id="trip-count">0</div>
                <div class="label">旅行次数</div>
            </div>
        </div>

        <!-- 地图视图 -->
        <div class="content-area" id="map-section">
            <div class="map-section">
                <div class="map-header">
                    <h2>🗺️ 我们的足迹</h2>
                    <span class="map-hint">👆 点击地图任意位置添加回忆</span>
                </div>
                <div id="map"></div>
            </div>

            <div class="sidebar">
                <!-- 最近去过的地方 -->
                <div class="recent-cities-card">
                    <h3>📍 最近去过的地方</h3>
                    <ul class="city-list" id="city-list"></ul>
                </div>

                <!-- 快捷添加 -->
                <div class="add-city-card">
                    <h3>📝 手动添加旅行</h3>
                    <p style="color: #888; font-size: 0.85rem; margin-bottom: 1rem;">点击左侧地图上的位置可自动识别城市，也可以在这里手动填写：</p>
                    <form id="add-city-form">
                        <div class="form-group">
                            <label>省份</label>
                            <select id="province-input" required>
                                <option value="">选择省份</option>
                                <option value="山东省">山东省</option>
                                <option value="江苏省">江苏省</option>
                                <option value="浙江省">浙江省</option>
                                <option value="广东省">广东省</option>
                                <option value="四川省">四川省</option>
                                <option value="云南省">云南省</option>
                                <option value="海南省">海南省</option>
                                <option value="北京市">北京市</option>
                                <option value="上海市">上海市</option>
                                <option value="重庆市">重庆市</option>
                                <option value="天津市">天津市</option>
                                <option value="河北省">河北省</option>
                                <option value="河南省">河南省</option>
                                <option value="湖北省">湖北省</option>
                                <option value="湖南省">湖南省</option>
                                <option value="安徽省">安徽省</option>
                                <option value="江西省">江西省</option>
                                <option value="陕西省">陕西省</option>
                                <option value="山西省">山西省</option>
                                <option value="辽宁省">辽宁省</option>
                                <option value="吉林省">吉林省</option>
                                <option value="黑龙江省">黑龙江省</option>
                                <option value="福建省">福建省</option>
                                <option value="贵州省">贵州省</option>
                                <option value="甘肃省">甘肃省</option>
                                <option value="青海省">青海省</option>
                                <option value="内蒙古">内蒙古</option>
                                <option value="广西">广西</option>
                                <option value="西藏">西藏</option>
                                <option value="宁夏">宁夏</option>
                                <option value="新疆">新疆</option>
                                <option value="香港">香港</option>
                                <option value="澳门">澳门</option>
                                <option value="台湾">台湾</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>城市</label>
                            <input type="text" id="city-input" placeholder="例如：济南" required>
                        </div>
                        <div class="form-group">
                            <label>旅行日期</label>
                            <input type="date" id="date-input" required>
                        </div>
                        <div class="form-group">
                            <label>天气</label>
                            <select id="weather-input">
                                <option value="☀️ 晴">☀️ 晴</option>
                                <option value="☁️ 多云">☁️ 多云</option>
                                <option value="🌧️ 雨">🌧️ 雨</option>
                                <option value="🌦️ 阵雨">🌦️ 阵雨</option>
                                <option value="❄️ 雪">❄️ 雪</option>
                                <option value="🌫️ 雾">🌫️ 雾</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>回忆记录</label>
                            <textarea id="memory-input" placeholder="记录下那天的故事吧..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>照片 (可多选)</label>
                            <input type="file" id="photo-input" accept="image/*" multiple>
                        </div>
                        <button type="submit" class="btn">💾 保存回忆</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 时间线视图 -->
        <div class="timeline-section" id="timeline-section" style="display: none;">
            <h2>📅 旅行时间线</h2>
            <div class="timeline" id="timeline"></div>
        </div>
    </div>

    <!-- 地图点击添加面板 -->
    <div class="map-add-overlay" id="add-overlay" onclick="closeAddPanel()"></div>
    <div class="map-add-panel" id="add-panel">
        <div style="position: absolute; top: 1rem; right: 1rem; cursor: pointer; font-size: 1.3rem; color: #999;" onclick="closeAddPanel()">✕</div>
        <h3>📍 添加旅行回忆</h3>
        <div class="location-info" id="add-location">正在识别位置...</div>
        <form id="map-add-form">
            <input type="hidden" id="add-lat">
            <input type="hidden" id="add-lng">
            <div class="form-group">
                <label>省份</label>
                <input type="text" id="add-province" placeholder="自动识别或手动输入">
            </div>
            <div class="form-group">
                <label>城市</label>
                <input type="text" id="add-city" placeholder="自动识别或手动输入">
            </div>
            <div class="form-group">
                <label>旅行日期</label>
                <input type="date" id="add-date" required>
            </div>
            <div class="form-group">
                <label>天气</label>
                <select id="add-weather">
                    <option value="☀️ 晴">☀️ 晴</option>
                    <option value="☁️ 多云">☁️ 多云</option>
                    <option value="🌧️ 雨">🌧️ 雨</option>
                    <option value="🌦️ 阵雨">🌦️ 阵雨</option>
                    <option value="❄️ 雪">❄️ 雪</option>
                    <option value="🌫️ 雾">🌫️ 雾</option>
                </select>
            </div>
            <div class="form-group">
                <label>回忆记录</label>
                <textarea id="add-memory" placeholder="那天发生了什么有趣的事..."></textarea>
            </div>
            <div class="form-group">
                <label>照片 (可多选)</label>
                <input type="file" id="add-photos" accept="image/*" multiple>
            </div>
            <button type="submit" class="btn">💾 保存回忆</button>
        </form>
    </div>

    <!-- 城市详情模态框 -->
    <div class="modal" id="city-modal" onclick="closeModal(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h1 id="modal-city-name">城市名</h1>
                <div class="modal-close" onclick="closeModalDirect()">✕</div>
            </div>
            <div class="modal-body">
                <div class="city-detail-date" id="modal-date"></div>
                <div class="city-detail-weather" id="modal-weather"></div>
                <div class="city-detail-description" id="modal-description"></div>
                <h3 style="color: var(--pink-dark); margin-bottom: 1rem;">📸 照片回忆</h3>
                <div class="photo-gallery" id="modal-photos"></div>
                <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #eee; display: flex; gap: 1rem;">
                    <button class="btn-danger" onclick="deleteCurrentCity()">🗑️ 删除这段回忆</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 照片灯箱 -->
    <div class="modal" id="photo-modal" onclick="this.classList.remove('active')">
        <div class="modal-content" style="background: transparent; box-shadow: none;" onclick="event.stopPropagation()">
            <div class="modal-close" onclick="document.getElementById('photo-modal').classList.remove('active')">✕</div>
            <img id="photo-full" src="" style="width: 100%; border-radius: 20px;">
        </div>
